services:
  frontend:
    ports:
      - "3100:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=wss://api.drawtocloud.com/ws
      - NEXT_PUBLIC_API_URL=https://api.drawtocloud.com
      - NEXT_PUBLIC_SITE_URL=https://app.drawtocloud.com
      - NEXT_PUBLIC_APP_DOMAIN=${NEXT_PUBLIC_APP_DOMAIN}
      - NEXT_PUBLIC_LANDING_DOMAIN=${NEXT_PUBLIC_LANDING_DOMAIN}
      - NEXT_PUBLIC_DEFAULT_TEMPLATE_SLUG=${NEXT_PUBLIC_DEFAULT_TEMPLATE_SLUG:-aie84ypr}

  backend:
    ports:
      - "8200:8000"
    environment:
      - ALLOWED_ORIGINS=https://app.drawtocloud.com
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
