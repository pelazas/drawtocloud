[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.84.0",
    "boto3>=1.40.0",
    "cryptography>=42.0.0",
    "fastapi>=0.135.1",
    "fpdf2>=2.8.5",
    "grandalf>=0.8",
    "openai>=2.26.0",
    "pillow>=10.0",
    "python-dotenv>=1.2.2",
    "supabase>=2.28.0",
    "uvicorn[standard]>=0.41.0",
    "websockets>=11,<16",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "flake8-blind-except>=0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
