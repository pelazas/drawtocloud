services:
  frontend:
    image: ghcr.io/pelazas/drawtocloud-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8200/ws}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8200}
        - NEXT_PUBLIC_APP_DOMAIN=${NEXT_PUBLIC_APP_DOMAIN}
        - NEXT_PUBLIC_LANDING_DOMAIN=${NEXT_PUBLIC_LANDING_DOMAIN}
        - NEXT_PUBLIC_DEFAULT_TEMPLATE_SLUG=${NEXT_PUBLIC_DEFAULT_TEMPLATE_SLUG:-aie84ypr}
    ports:
      - "3100:3000"
    environment:
      - NEXT_PUBLIC_SITE_URL=https://app.drawtocloud.com
    volumes: []

  backend:
    image: ghcr.io/pelazas/drawtocloud-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8200:8000"
    environment:
      - WEB_CONCURRENCY=1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_KEY_ENCRYPTION_SECRET=${LLM_KEY_ENCRYPTION_SECRET}
      - LLM_KEY_ENCRYPTION_SECRET_PREVIOUS=${LLM_KEY_ENCRYPTION_SECRET_PREVIOUS:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3100,https://app.drawtocloud.com}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - RATE_LIMIT_IP_RPM=${RATE_LIMIT_IP_RPM:-60}
      - RATE_LIMIT_USER_RPM=${RATE_LIMIT_USER_RPM:-30}
      - RATE_LIMIT_WS_PER_IP=${RATE_LIMIT_WS_PER_IP:-10}
      - RATE_LIMIT_WS_PER_USER=${RATE_LIMIT_WS_PER_USER:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes: []
